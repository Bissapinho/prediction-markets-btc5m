[project]
name = "pm-btc5m-study"
version = "1.0.0"
description = "Price formation in 5-minute BTC prediction markets"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=17",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6",
    "zstandard>=0.22",
    "tzdata>=2024.1",
    "numpy>=2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "torch>=2.3",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pm = "pipelines.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipelines*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
